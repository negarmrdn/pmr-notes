site_name: PM&R Study Notes
site_description: Physical Medicine & Rehabilitation study notes by Negar Moradian, MD, MPH
site_author: Negar Moradian
site_url: https://negarmrdn.github.io/pmr-notes/
repo_url: https://github.com/negarmrdn/pmr-notes
repo_name: negarmrdn/pmr-notes
edit_uri: edit/main/docs/
copyright: Personal study notes for education. Not medical advice.

theme:
  name: material
  language: en
  icon:
    logo: material/human-handsup
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
    - content.action.edit
    - content.tooltips
    - content.code.copy

extra_css:
  - assets/extra.css

plugins:
  - search
  - tags
  - awesome-pages
  - git-revision-date-localized:
      type: date
      fallback_to_build_date: true
      enable_creation_date: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.mark
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
